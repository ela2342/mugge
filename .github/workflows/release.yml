# US-172 R6a' build-only workflow (experiment branch, NEVER merge)
#
# Replaces the release pipeline on experiment/US-172-R6a-bcm2712-kernel
# only. workflow_dispatch needs a workflow file that exists on main, so
# this reuses release.yml's name; the dispatch runs this branch's copy.
#
# It builds the Pi 5 deploy toplevel (bcm2712_defconfig, 16K pages, RT
# kernel) on the native ARM runner and pushes every built path to the
# mugge cachix, so the Pi can substitute it (Architect restart reading
# r1 ee7e28f4, section 5 route C). No release, no artifact upload.
#
# Dispatch: gh workflow run release.yml --ref experiment/US-172-R6a-bcm2712-kernel

name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pi5-toplevel:
    runs-on: ubuntu-24.04-arm
    # Kernel compile on 4 vCPU; GitHub-hosted jobs stop at 6 h anyway.
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Free runner disk
        run: |
          df -h /
          # Preinstalled toolchains we never use; the kernel build plus
          # closure does not fit in the default free space.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (= v6.1.0)

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31 = upstream master HEAD on 2026-10-24 (2 commits after v31.11.2; ships Nix 2.35.4)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install

      - name: Verify Nix version
        run: |
          nix --version
          test "$(nix --version)" = "nix (Nix) 2.35.4"

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: mugge
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Pi 5 deploy toplevel
        run: |
          echo "commit ${GITHUB_SHA}"
          echo "START $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cachix watch-exec mugge -- nix build --print-build-logs \
            --print-out-paths --out-link result-toplevel \
            .#nixosConfigurations.mugge-pi5-deploy.config.system.build.toplevel
          echo "END $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          df -h /

      - name: Build kernel dev output (built .config)
        # Same derivation as the kernel above, so this only fetches/links
        # the -dev output; pushed to cachix for the desk check.
        run: |
          cachix watch-exec mugge -- nix build --print-out-paths \
            --out-link result-kernel-dev \
            .#nixosConfigurations.mugge-pi5-deploy.config.boot.kernelPackages.kernel.dev

      - name: Report out paths and kernel config
        run: |
          top=$(readlink -f result-toplevel)
          echo "toplevel: $top"
          echo "drvPath:  $(nix path-info --derivation .#nixosConfigurations.mugge-pi5-deploy.config.system.build.toplevel)"
          echo "kernel:   $(readlink -f "$top/kernel")"
          echo "initrd:   $(readlink -f "$top/initrd")"
          echo "modules:  $(readlink -f "$top/kernel-modules")"
          kdir=$(dirname "$(readlink -f "$top/kernel")")
          echo "dtbs:     $kdir/dtbs"
          echo "closure size: $(nix path-info -S -h "$top" | awk '{print $2, $3}')"
          cfg=$(readlink -f result-kernel-dev)/lib/modules/*/build/.config
          grep -E '^(# )?CONFIG_(LOCALVERSION|PREEMPT_RT|EXPERT|IKCONFIG(_PROC)?|ARM64_(4K|16K)_PAGES|ARM64_VA_BITS|DRM_V3D|DRM_VC4)[ =]' $cfg
          for want in CONFIG_ARM64_16K_PAGES=y CONFIG_PREEMPT_RT=y CONFIG_IKCONFIG_PROC=y CONFIG_DRM_VC4=m CONFIG_DRM_V3D=m; do
            grep -qx "$want" $cfg || { echo "::error::missing $want"; exit 1; }
          done
          # Pins for the Pi-side checks: Image sha, built .config sha, banner.
          sha256sum "$(readlink -f "$top/kernel")" $cfg
          # No grep -m1: an early exit would SIGPIPE strings under pipefail.
          strings "$(readlink -f "$top/kernel")" | grep '^Linux version '
          mods=$(readlink -f "$top/kernel-modules")
          for ko in vc4 v3d; do
            find -L "$mods/lib/modules" -name "$ko.ko*" | grep . || { echo "::error::missing $ko module"; exit 1; }
          done
          ls "$kdir/dtbs/broadcom/" | grep bcm2712
          ls "$kdir/dtbs/overlays/" | grep -E 'vc4-kms-v3d-pi5|disable-bt-pi5'
