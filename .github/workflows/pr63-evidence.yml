# PR #63 evidence run (joint QE + Architect evidence route v2, routes 1 and 2a).
# Scratch branch only, never merged. Non-gating. Checks out the exact PR
# head SHA below (not a merge ref) and builds the two F-318 checks on the
# same native arm64 runner type as ci.yml's test-and-build. Cachix is
# read-only here (no auth token): nothing is pushed to the cache.

name: PR63 evidence

on:
  push:
    branches: ['scratch/pr63-evidence-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SHA: 3f28b6c75d2b40e1752bb8f1ca9ae67b76f90fdd

jobs:
  evidence:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (= v6.1.0)
        with:
          ref: ${{ env.EVIDENCE_SHA }}

      - name: Checked-out SHA
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          echo "HEAD $head"
          test "$head" = "$EVIDENCE_SHA"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31 = upstream master HEAD on 2026-10-24 (2 commits after v31.11.2; ships Nix 2.35.4)
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install

      - name: Verify Nix version and sandbox
        run: |
          nix --version
          test "$(nix --version)" = "nix (Nix) 2.35.4"
          nix config show sandbox
          test "$(nix config show sandbox)" = "true"

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: mugge

      - name: jack-self-connect (route 1)
        run: |
          set -euo pipefail
          attr=.#checks.aarch64-linux.jack-self-connect
          echo "drvPath $(nix eval --raw $attr.drvPath)"
          out=$(nix build --no-link -L --print-out-paths $attr)
          echo "out $out"
          ls -la "$out"
          for f in fragments.txt policy.txt control.txt summary.txt; do
            echo "===== $f ====="
            cat "$out/$f"
          done

      - name: wireplumber-no-bypass (route 2a)
        run: |
          set -euo pipefail
          attr=.#checks.aarch64-linux.wireplumber-no-bypass
          echo "drvPath $(nix eval --raw $attr.drvPath)"
          out=$(nix build --no-link -L --print-out-paths $attr)
          echo "out $out"
          ls -la "$out"
          find "$out" -type f | sort | while read -r f; do
            echo "===== ${f#$out/} ====="
            cat "$f"
          done
