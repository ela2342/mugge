# F-358: direct RT scheduling for PipeWire, no RTKit.
#
# The stock module-rt args set nice.level = -11. The user manager's
# RLIMIT_NICE is 0, so that fails with EPERM, and module-rt then hands
# every thread to RTKit, which grants only RR 20 to the data loops.
# RLIMIT_RTPRIO is 95, so the direct path works when the nice step is
# skipped.
#
# Disable the stock module-rt entry (its condition is module.rt = !false)
# and load it again with:
#   nice.level = 20      out of range, i.e. "don't change"
#   rt.prio = 88         data loops at SCHED_FIFO 88 (D-013, F-020)
#   rtkit/rtportal off   no silent fallback to RR 20
# Deployed as 05-rt-direct.conf (no hash prefix) so it loads ahead of
# the filter-chain module in 30-.
context.properties = {
    module.rt = false
}

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level       = 20
            rt.prio          = 88
            rtkit.enabled    = false
            rtportal.enabled = false
        }
        flags = [ ifexists nofail ]
    }
]
