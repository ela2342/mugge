# 80-jack-no-autoconnect.conf — JACK client rules.
#
# Prevents JACK applications (Mixxx, Reaper) from auto-connecting their
# ports to hardware sinks on startup.  All routing is managed by
# GraphManager.
#
# F-295: rt.prio = 70 promotes JACK client audio callback threads to
# SCHED_FIFO/70. This is below PipeWire (88) and GraphManager (80) but
# above all non-audio processes. Without this, Mixxx's audio engine
# thread runs at SCHED_OTHER and gets preempted, causing clicks.
#
# F-318 (US-173, Architect + AE): jack.self-connect-mode = ignore-external.
# A JACK client's connect between one of its own ports and another
# client's port (e.g. PortAudio linking Mixxx's outputs to the USBStreamer)
# becomes a no-op that still returns success, so the app neither errors
# nor gets a link. Connects between two of its own ports stay allowed.
# Native PipeWire links (GraphManager, pw-link) are not affected. Not
# fail-*: apps may abort on the error. A third-party connect (patchbay,
# jack_connect CLI: neither port the caller's own) is outside this mode;
# GraphManager's link audit detects those.
# Proof: nix/checks/jack-self-connect.nix.
#
# Pi destination: /etc/pipewire/jack.conf.d/80-jack-no-autoconnect.conf
# (nix/nixos/audio/pipewire.nix, services.pipewire.configPackages).

jack.properties = {
  jack.self-connect-mode = ignore-external
}

jack.rules = [
  {
    matches = [
      {
        # Match all JACK clients — routing is always GraphManager-managed.
        application.process.binary = "~.*"
      }
    ]
    actions = {
      update-props = {
        node.autoconnect = false
        rt.prio         = 70
      }
    }
  }
]
