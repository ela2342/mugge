# US-163: disable every ALSA card except the USBStreamer and the UMIK-1.
#
# HiFiBerry block, layer (c) (AE ruling, AC hifiberry-blocked). The Pi 5
# bench unit has a HiFiBerry DAC+ HAT fitted, and its HDMI outputs show up
# as ALSA cards. None of these may become a PipeWire sink or the default
# output: they would be outputs outside the D-063 gain gate. Layers (a)
# and (b) keep the HiFiBerry from appearing at all; this rule also covers
# HDMI and anything plugged in later.
#
# The USBStreamer device is already disabled by 50-usbstreamer-disable-acp
# (static adapters in pipewire.conf.d handle it). The UMIK-1 stays enabled
# for measurement.
#
# Deployed only on boards with mugge.board.hat.blockHifiberry (Pi 5).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "!~alsa_card\\.usb-.*(USBStreamer|[Uu][Mm][Ii][Kk]).*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
