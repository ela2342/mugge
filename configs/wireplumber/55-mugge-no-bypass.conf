# F-318: Load the no-bypass linking policy script.
#
# WirePlumber never auto-links playback streams (GraphManager owns every
# link to the convolver and the USBStreamer), and never picks the
# USBStreamer or the convolver as default.audio.sink. Capture streams
# keep the stock policy.
#
# Required: if the script fails to load, WirePlumber fails to start
# instead of running without the policy.
#
# Script: scripts/mugge-no-bypass.lua

wireplumber.components = [
  {
    name = mugge-no-bypass.lua, type = script/lua
    provides = custom.mugge-no-bypass
  }
]

wireplumber.profiles = {
  main = {
    custom.mugge-no-bypass = required
  }
}
