# Venue config: foh-passthrough (US-113).
#
# FOH (front-of-house) passthrough — unity gain on all channels with Dirac
# (identity) coefficients.  It is not a first-boot default: there is no
# built-in default venue (F-465), and PI4AUDIO_DEFAULT_VENUE is opt-in and
# set nowhere.  It is armed only by an explicit set_venue, and after that it
# is restored at every startup (US-123) until another venue is set.  It has
# no driver protection (D-031): never open the gate on own speakers with
# this venue armed.
#
# Gain at 0 dB (unity, Mult 1.0) on all channels.  The operator controls
# output level at the source (Mixxx/Reaper faders) and the amplifier gain
# knobs — standard FOH gain staging.
#
# Safety: D-009 caps all Mult values at 1.0.  D-063 audio gate ensures
# gains are not applied until the operator explicitly opens the gate.
# D-031 driver protection is provided by the convolver coefficient files
# (crossover slopes baked into the FIR filters), not by venue gain values.
#
# SAFETY: Channels 1-4 use dirac.wav (no crossover protection).
# DO NOT use this config for real PA operation until D-031 protection
# filter WAVs (protection_hp.wav / protection_lp.wav) are generated
# and referenced here.  Full-bandwidth signal to sub drivers at unity
# gain through 450W amplifiers risks driver damage.
# Tracked as defect D-271.  D-063 gate provides interim protection.

name: "foh-passthrough"
description: "FOH passthrough — unity gain, Dirac coefficients, all channels"

channels:
  1_sat_l:
    gain_db: 0
    delay_ms: 0
    coefficients: "dirac.wav"
  2_sat_r:
    gain_db: 0
    delay_ms: 0
    coefficients: "dirac.wav"
  3_sub1_lp:
    gain_db: 0
    delay_ms: 0
    coefficients: "dirac.wav"
  4_sub2_lp:
    gain_db: 0
    delay_ms: 0
    coefficients: "dirac.wav"
  5_eng_l:
    gain_db: 0
    delay_ms: 0
    coefficients: "dirac.wav"
  6_eng_r:
    gain_db: 0
    delay_ms: 0
    coefficients: "dirac.wav"
  7_iem_l:
    gain_db: 0
    delay_ms: 0
    coefficients: "dirac.wav"
  8_iem_r:
    gain_db: 0
    delay_ms: 0
    coefficients: "dirac.wav"
