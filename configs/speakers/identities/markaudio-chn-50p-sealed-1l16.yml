# Markaudio CHN-50P — sealed box satellite (1.16L enclosure)
# 2-inch full-range driver in compact sealed box.
# Designed as satellite for Bose PS28 III subwoofer system.
#
# Sealed box analysis (AE-reviewed):
#   Enclosure volume: 1.16 liters
#   Qtc: 0.764, Fc: 157Hz, F3: 107Hz
#   Alignment: slightly underdamped (good transient response)
#
# CRITICAL: max_power_watts is only 7W (-18.1 dB re 450 W). This driver
# has very low thermal capacity, so power limiting is essential. Nothing
# enforces it at runtime yet: the profile's power_limit_db is declarative
# only, and gain_integrity checks only the global Mult <= 1.0 (F-322).
# Never run this driver at unity gain (e.g. the foh-passthrough venue).
# Agreed per-channel ceiling (G9): Mult <= 0.112 (about -19 dB).
#
# Mains-only. It must run behind its venue crossover FIR (200 Hz in
# markaudio-ultimax-200hz), which must also meet the 80 Hz
# mandatory_hpf_hz floor (D-031). With unfiltered (Dirac) coefficients,
# excursion reaches Xmax at about -17 dB re full scale, within 2 dB of
# the -19 dB (Mult 0.112) G9 ceiling.
#
# mandatory_hpf_hz at 80Hz protects against excursion below the
# crossover region where the sub takes over (must be embedded in the
# FIR; no separate HPF stage since D-040).

name: "Markaudio CHN-50P Sealed 1.16L"
manufacturer: "Markaudio"
model: "CHN-50P"
driver: markaudio-chn-50p
type: sealed
enclosure_volume_liters: 1.16

impedance_ohm: 4
sensitivity_db_spl: 87.5

# Sealed box parameters (AE analysis)
sealed_qtc: 0.764
sealed_fc_hz: 157
sealed_f3_hz: 107

# D-029 gain staging
max_boost_db: 0
mandatory_hpf_hz: 80

# Power handling
max_power_watts: 7
power_limit_note: "CRITICAL: Only 7W thermal limit. Aggressive power limiting required."

# Compensation EQ — none yet, pending listening-position measurement.
compensation_eq: []
